[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sd40-linker-ranker"
version = "0.1.0"
description = "Automatic geometric ranking of ADAR2-linker-SD40 PDB models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
sd40-linker-rank = "sd40_linker_ranker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

